[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-prism"
version = "0.1.0"
description = "Pytest plugin that uploads run artifacts to a Prism instance via pluggable renderers"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Travis Collins", email = "travis.collins@analog.com" }]
readme = "README.md"
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pytest>=7.0",
]

[project.entry-points.pytest11]
pytest_prism = "pytest_prism.plugin"

[project.urls]
Homepage = "https://github.com/analogdevicesinc/prism"
Source = "https://github.com/analogdevicesinc/prism/tree/main/clients/python-pytest"

[dependency-groups]
dev = [
  "pytest>=7.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_prism"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
