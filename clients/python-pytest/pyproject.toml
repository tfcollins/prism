[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-prism"
version = "0.1.0"
description = "Pytest plugin that uploads run artifacts to a Prism instance via pluggable renderers"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Travis Collins", email = "travis.collins@analog.com" }]
readme = "README.md"
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pytest>=7.0",
  # XXE-safe XML parsing for junit.xml (drop-in replacement for stdlib ElementTree)
  "defusedxml>=0.7",
]

[project.entry-points.pytest11]
pytest_prism = "pytest_prism.plugin"

[project.urls]
Homepage = "https://github.com/analogdevicesinc/prism"
Source = "https://github.com/analogdevicesinc/prism/tree/main/clients/python-pytest"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "httpx>=0.27",
  # Bound the linters to one minor each — see apps/api/pyproject.toml for why
  # (unbounded ruff lets a new release silently reformat and fail CI).
  "ruff>=0.15,<0.16",
  "mypy>=1.20,<1.21",
  "types-defusedxml",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "pytest-randomly>=3.15",
  "pytest-clarity>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_prism"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",  # asserts ok in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S105", "S106", "S107", "S108"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["src/pytest_prism"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
  "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "-n auto --durations=10 --cov --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml"
