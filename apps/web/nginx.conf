server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Run uploads carry a JUnit report plus a zip of logs and artifacts
  # (serial consoles, pytest transcripts, waveforms); nginx's 1 MB default
  # rejects them with 413.
  client_max_body_size 64m;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
