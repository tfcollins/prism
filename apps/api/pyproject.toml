[project]
name = "prism-api"
version = "0.1.0"
description = "Prism API and Celery worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt<5.0",
  "ldap3>=2.9",
  "email-validator>=2",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "celery[redis]>=5.3",
  "junitparser>=3.1",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "h5py>=3.10",
  "fpdf2>=2.8.7",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  # Pin the linters to a single minor each: ruff's formatter and lint rules
  # change between minors, so an unbounded `>=` lets a new release silently
  # reformat the tree and fail `ruff format --check` in CI. Bump deliberately
  # (and re-run `ruff format`) rather than drifting. Matches uv.lock.
  "ruff>=0.15,<0.16",
  "mypy>=1.20,<1.21",
  "types-passlib",
  "types-python-jose",
  "freezegun>=1.4",
  "moto[s3]>=5.0",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "pytest-randomly>=3.15",
  "pytest-clarity>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",  # asserts ok in tests
  "B008",  # FastAPI requires Depends() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
warn_unreachable = true

# Third-party libs that don't ship type stubs. Suppress at the import
# boundary so our own code stays strictly checked.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "h5py", "boto3", "boto3.*", "mypy_boto3_s3.*", "scipy", "scipy.*", "ldap3", "ldap3.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/prism_api"]
branch = false
omit = ["src/prism_api/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
  "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto --durations=10 --cov --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml"
filterwarnings = [
  "error",
  # passlib imports the stdlib 'crypt' module which is deprecated in Python 3.12;
  # this is a passlib internals issue, not our code.
  "ignore::DeprecationWarning:passlib",
  # python-jose emits deprecation warnings in some configurations
  "ignore::DeprecationWarning:jose",
  # ldap3 imports deprecated names (tagMap/typeMap) from pyasn1 at import time;
  # third-party internals, not our code.
  "ignore::DeprecationWarning:pyasn1",
  "ignore::DeprecationWarning:ldap3",
  # SQLAlchemy model classes TestRun/TestCase/TestSuite are domain names (not test classes);
  # pytest incorrectly tries to collect them because of the "Test" prefix.
  "ignore::pytest.PytestCollectionWarning",
  # In-memory SQLite connections are freed at garbage-collection time, when
  # sqlite3 emits "ResourceWarning: unclosed database". Under filterwarnings=error
  # the GC can fire during an unrelated test and fail it (a flaky,
  # order-dependent PytestUnraisableExceptionWarning). Test fixtures and the CLI
  # dispose their engines (so this is rare), but ignoring the benign warning
  # makes the suite deterministic regardless of GC timing.
  "ignore:unclosed database:ResourceWarning",
]
