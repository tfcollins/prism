name: docs

on:
  push:
    branches: [main, master]
  pull_request:

# Least-privilege by default; the deploy job opts into the extra scopes it needs.
permissions:
  contents: read

# Serialize Pages deploys; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt
      - name: Build docs (strict — warnings are errors)
        run: sphinx-build -b html -W --keep-going docs/source docs/build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    # Publish only from the default branch — never from pull requests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
