name: lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: latest }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - working-directory: apps/api
        run: |
          uv pip install --system .[dev] || uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run ruff check ../../scripts
          uv run ruff format --check ../../scripts
          uv run mypy ../../scripts
          # docs/ helper scripts (shots.py, conf.py). mypy is skipped: shots.py
          # imports playwright, an optional browser-automation dep not installed
          # in this job.
          uv run ruff check ../../docs
          uv run ruff format --check ../../docs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci || npm install
          npm run lint

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx markdownlint-cli2 "**/*.md"

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:latest -color

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        run: |
          for f in apps/api/Dockerfile apps/api/Dockerfile.dev apps/web/Dockerfile apps/web/Dockerfile.dev; do
            echo "==> $f"
            docker run --rm -i hadolint/hadolint:latest-alpine < "$f"
          done
