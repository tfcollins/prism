name: e2e

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      MINIO_IMAGE: ghcr.io/intikhab49/minio-from-source:RELEASE.2025-09-07T16-13-09Z@sha256:ab18eaa7dc47921150f806865b7da9f5021b7f4d180a1b53ca33851de8940c52
    steps:
      - uses: actions/checkout@v4
      - name: Generate .env
        run: cp deploy/.env.example deploy/.env
      - name: Bring up the stack
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml --env-file deploy/.env up -d --build
      - name: Wait for api
        run: |
          for _ in {1..60}; do
            if curl -sf http://localhost:8000/api/v1/health; then break; fi
            sleep 2
          done
      - name: Wait for web
        run: |
          for _ in {1..60}; do
            if curl -sf http://localhost:8180; then break; fi
            sleep 2
          done
      - name: Seed demo data (creates the `audio` project the e2e tests reference)
        run: |
          python3 scripts/seed_demo.py
        env:
          PRISM_URL: http://localhost:8000
          PRISM_EMAIL: admin@example.com
          PRISM_PASSWORD: analog
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8180
          PLAYWRIGHT_ADMIN_EMAIL: admin@example.com
          PLAYWRIGHT_ADMIN_PASSWORD: analog
      - if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml --env-file deploy/.env logs --tail=200
