name: prism

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prism}
      POSTGRES_USER: ${POSTGRES_USER:-prism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-prism}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      PRISM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PRISM_S3_ENDPOINT: http://minio:9000
      PRISM_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      PRISM_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      PRISM_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PRISM_S3_BUCKET: prism
      PRISM_REDIS_URL: redis://redis:6379/0
      PRISM_JWT_SECRET: ${JWT_SECRET}
      PRISM_ADMIN_EMAIL: ${ADMIN_EMAIL}
      PRISM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PRISM_LDAP_ENABLED: ${LDAP_ENABLED:-false}
      PRISM_LDAP_SERVER: ${LDAP_SERVER:-}
      PRISM_LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      PRISM_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      PRISM_LDAP_USER_BASE_DN: ${LDAP_USER_BASE_DN:-}
      PRISM_LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(mail={email})}
      PRISM_LDAP_EMAIL_ATTRIBUTE: ${LDAP_EMAIL_ATTRIBUTE:-mail}
      PRISM_LDAP_START_TLS: ${LDAP_START_TLS:-false}
      PRISM_DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      # Read-only Docker socket so the admin "container logs" viewer can read
      # the stack's logs. Grants the api host-level Docker visibility — admins
      # only (require_admin), read-only. Remove this mount to disable the viewer.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [api]

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      PRISM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PRISM_S3_ENDPOINT: http://minio:9000
      PRISM_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      PRISM_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      PRISM_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PRISM_S3_BUCKET: prism
      PRISM_REDIS_URL: redis://redis:6379/0
      PRISM_JWT_SECRET: ${JWT_SECRET}
    entrypoint: []
    command: ["celery", "-A", "prism_api.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]

  # Scheduled database backups pushed to Cloudsmith. Off by default — enable by
  # adding the "backup" profile (e.g. COMPOSE_PROFILES=backup in .env) and
  # setting CLOUDSMITH_API_KEY + CLOUDSMITH_REPO. See the configure-backups how-to.
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prism}
      POSTGRES_USER: ${POSTGRES_USER:-prism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_HOST: postgres
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-prism}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-prism}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INCLUDE_MINIO: ${BACKUP_INCLUDE_MINIO:-true}
      CLOUDSMITH_API_KEY: ${CLOUDSMITH_API_KEY:-}
      CLOUDSMITH_REPO: ${CLOUDSMITH_REPO:-}

volumes:
  postgres_data:
  minio_data:
