services:
  postgres:
    ports: ["5432:5432"]

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  redis:
    ports: ["6379:6379"]

  api:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ../apps/api/src:/app/src
    ports: ["8000:8000"]
    command: ["uvicorn", "prism_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ../apps/web/src:/app/src
      - ../apps/web/index.html:/app/index.html
    ports: ["8080:5173"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
